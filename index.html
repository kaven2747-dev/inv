<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>

<title>재고 관리 (1)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --p:#FF6E41;--pd:#E85520;--ps:#FFF0EB;--pm:#FFCFBF;
  --bg:#FFF8F5;--card:#FFFFFF;--bd:#FFD6C5;
  --tx:#1A0F0A;--txs:#8C6355;--txl:#C4A090;
  --ok:#0F9E6E;--okb:#EDFAF4;
  --wn:#C47E00;--wnb:#FFFBEA;
  --er:#D93025;--erb:#FDECEA;--erd:#F5A89E;
}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--tx);overscroll-behavior:none;}
input,select,button{font-family:inherit;}
#app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
.hdr{background:#fff;border-bottom:2px solid var(--pm);padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(255,110,65,0.08);position:sticky;top:0;z-index:50;}
.hdr-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--p),var(--pd));border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
.content{flex:1;overflow-y:auto;padding:12px;padding-bottom:80px;}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:2px solid var(--bd);display:flex;z-index:100;box-shadow:0 -2px 10px rgba(255,110,65,0.07);}
.nb{flex:1;background:none;border:none;cursor:pointer;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;color:var(--txl);position:relative;}
.nb.on{color:var(--p);font-weight:900;}
.nb.on::before{content:'';position:absolute;top:0;left:22%;right:22%;height:2.5px;background:var(--p);border-radius:0 0 3px 3px;}
.tab{display:none;}.tab.on{display:block;}
.btn{padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:700;font-size:13px;border:none;}
.bp{background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;}
.bs{background:linear-gradient(135deg,#0F9E6E,#0A7A54);color:#fff;}
.bg{background:#fff;color:var(--p);border:1.5px solid var(--pm);}
.inp{width:100%;background:var(--bg);border:1.5px solid var(--bd);border-radius:8px;padding:9px 11px;color:var(--tx);font-size:14px;outline:none;}
.inp:focus{border-color:var(--p);}
.ov{position:fixed;inset:0;background:rgba(60,15,0,0.35);z-index:1000;display:flex;align-items:flex-end;justify-content:center;}
.mb{background:#fff;border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:500px;max-height:92vh;overflow-y:auto;box-shadow:0 -4px 30px rgba(255,110,65,0.18);}
.mh{width:36px;height:4px;background:var(--pm);border-radius:2px;margin:0 auto 16px;}
.mt{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.card{background:#fff;border:1.5px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px;}
.atabs{display:flex;gap:6px;margin-bottom:14px;}
.atab{flex:1;padding:8px 4px;border-radius:9px;border:1.5px solid var(--bd);background:#fff;color:var(--txs);cursor:pointer;font-size:12px;font-weight:900;}
.atab.on{background:var(--p);color:#fff;border-color:var(--p);}
.cat-body{background:#fff;border:1.5px solid var(--pm);border-top:none;border-radius:0 0 12px 12px;overflow:hidden;margin-bottom:10px;}
.ir{padding:10px 11px;position:relative;overflow:hidden;}
.mg{display:grid;grid-template-columns:2fr 1fr 1fr 2fr auto;gap:4px;align-items:stretch;}
.bx{border-radius:6px;padding:4px 5px;text-align:center;}
.bx .bl{font-size:8px;font-weight:700;margin-bottom:1px;letter-spacing:0.3px;}
.bx .bv{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bn{background:#F7F3F1;}.bn .bl{color:var(--txl);}.bn .bv{color:var(--tx);}
.ba{background:var(--ps);}.ba .bl{color:var(--p);}.ba .bv{color:var(--p);}
.br{background:var(--erb);}.br .bl{color:var(--er);}.br .bv{color:var(--er);}
.sc{display:flex;gap:6px;align-items:center;}
.sm,.sp{flex:1;padding:5px;font-size:18px;line-height:1;border-radius:8px;}
.sd{flex:2;text-align:center;background:var(--bg);border-radius:7px;padding:5px 0;font-size:13px;font-weight:700;}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.sb{border-radius:10px;padding:10px 12px;}
.sb .sl{font-size:9px;font-weight:700;margin-bottom:3px;text-transform:uppercase;letter-spacing:0.5px;}
.sb .sv{font-size:13px;font-weight:800;}
.sbn{background:#F7F3F1;}.sbn .sl{color:var(--txl);}.sbn .sv{color:var(--tx);}
.sba{background:var(--ps);}.sba .sl{color:var(--p);}.sba .sv{color:var(--tx);}
.so{display:flex;gap:7px;margin-bottom:12px;}
.sop{flex:1;padding:9px 4px;border-radius:9px;border:1.5px solid var(--bd);background:#fff;color:var(--txs);cursor:pointer;font-size:11px;font-weight:700;text-align:center;}
.sop.on{border-color:var(--p);background:var(--ps);color:var(--p);}
.os{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:800;white-space:nowrap;flex-shrink:0;}
.op{background:var(--wnb);color:var(--wn);border:1px solid #E5CC70;}
.od{background:var(--okb);color:var(--ok);border:1px solid #9EE5CC;}
.sh{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
.lbox{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px;}
.qs{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--bd);border-radius:7px;padding:4px 8px;}
.qs button{background:none;border:none;cursor:pointer;color:var(--p);font-weight:700;font-size:16px;line-height:1;}
.gc{background:linear-gradient(135deg,var(--p),var(--pd));border-radius:14px;padding:16px;margin-bottom:14px;}
.gg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.gbx{background:rgba(255,255,255,0.2);border-radius:8px;padding:9px 8px;}
.gbx .gl{font-size:9px;color:rgba(255,255,255,0.75);font-weight:700;margin-bottom:2px;}
.gbx .gv{font-size:12px;font-weight:900;color:#fff;}
.pc{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
</style>
</head>

    </button>
    <button class="nb" onclick="go('ship')">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>배송
    </button>
    <button class="nb" onclick="go('stat')">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg>통계
    </button>
  </nav>
</div>

<div id="ov" class="ov" style="display:none" onclick="closeModalOv(event)">
  <div class="mb" onclick="event.stopPropagation()">
    <div class="mh"></div>
    <div class="mt">
      <span id="mtitle" style="font-weight:900;font-size:16px;"></span>
      <button class="bg btn" onclick="closeModal()" style="padding:5px 8px;">✕</button>
    </div>
    <div id="mbody"></div>
  </div>
</div>

<script>
var ACCS = ["Shibuki","MATJUIL","중고나라"];
var SHIPS = [{l:"일반택배",f:4000},{l:"알뜰택배",f:2500},{l:"택배비무료",f:0}];
var COLORS = [
  {n:"오렌지", v:"linear-gradient(135deg,#FF6E41,#E85520)"},
  {n:"레드",   v:"linear-gradient(135deg,#E53935,#B71C1C)"},
  {n:"핑크",   v:"linear-gradient(135deg,#E91E8C,#AD1457)"},
  {n:"퍼플",   v:"linear-gradient(135deg,#7B1FA2,#4A148C)"},
  {n:"인디고", v:"linear-gradient(135deg,#3949AB,#1A237E)"},
  {n:"블루",   v:"linear-gradient(135deg,#1E88E5,#0D47A1)"},
  {n:"틸",     v:"linear-gradient(135deg,#00897B,#004D40)"},
  {n:"그린",   v:"linear-gradient(135deg,#43A047,#1B5E20)"},
  {n:"브라운", v:"linear-gradient(135deg,#6D4C41,#3E2723)"},
  {n:"슬레이트",v:"linear-gradient(135deg,#546E7A,#263238)"}
];

function krw(n){ return (n||0).toLocaleString("ko-KR")+"원"; }
function bunge(p){ return Math.floor(p/0.94/10)*10; }
function todayKey(){ var d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function dateStr(){
  var d=new Date();
  return d.getFullYear()+". "+String(d.getMonth()+1).padStart(2,"0")+". "+String(d.getDate()).padStart(2,"0");
}

var S={
  items:{Shibuki:[],MATJUIL:[],"중고나라":[]},
  orders:[],acc:"Shibuki",
  catOrder:{}, // acc -> [cat, cat, ...]
  shipTab:"pend", // pending | done
  col:{},exp:{},catColors:{},catImages:{},daily:{},totals:{},
  sAcc:"",sLines:[{cat:"",iid:"",qty:1}],sShip:null
};

function loadS(){
  try{
    var raw=localStorage.getItem("inv_v3");
    if(!raw)return;
    var d=JSON.parse(raw);
    if(!d)return;
    ACCS.forEach(function(a){ S.items[a]=Array.isArray(d.items&&d.items[a])?d.items[a]:[]; });
    S.orders=Array.isArray(d.orders)?d.orders:[];
    if(d.catColors&&typeof d.catColors==="object") S.catColors=d.catColors;
    if(d.catImages&&typeof d.catImages==="object") S.catImages=d.catImages;
    if(d.daily&&typeof d.daily==="object") S.daily=d.daily;
    if(d.totals&&typeof d.totals==="object") S.totals=d.totals;
    if(d.catOrder&&typeof d.catOrder==="object") S.catOrder=d.catOrder;
  }catch(e){}
}
function saveS(){
  try{ localStorage.setItem("inv_v3",JSON.stringify({items:S.items,orders:S.orders,catColors:S.catColors,catImages:S.catImages,daily:S.daily,totals:S.totals,catOrder:S.catOrder})); }catch(e){}
}
function escHtml(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
loadS();

var ICO={
  trash:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>',
  plus:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  info:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
  cu:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>',
  cd:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>',
  eu:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>',
  ed:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FF6E41" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>'
};

function go(t){
  document.querySelectorAll(".tab").forEach(function(e){e.classList.remove("on");});
  document.querySelectorAll(".nb").forEach(function(e){e.classList.remove("on");});
  document.getElementById("t-"+t).classList.add("on");
  var idx={inv:0,sale:1,ship:2,stat:3}[t];
  document.querySelectorAll(".nb")[idx].classList.add("on");
  if(t==="inv") renderInv();
  else if(t==="sale") renderSale();
  else if(t==="ship") renderShip();
  else if(t==="stat") renderStat();
}

function showModal(title,html){
  document.getElementById("mtitle").textContent=title;
  document.getElementById("mbody").innerHTML=html;
  document.getElementById("ov").style.display="flex";
}
function closeModal(){ document.getElementById("ov").style.display="none"; }
function closeModalOv(e){ if(e.target===document.getElementById("ov")) closeModal(); }

function catColor(acc,cat){
  return S.catColors[acc+"_"+cat]||"linear-gradient(135deg,#FF6E41,#E85520)";
}

// ── Category Edit ─────────────────────────────────
// Called via: onclick="editCat(this)" with data-acc and data-cat on the button
function editCat(btn){
  var acc=btn.getAttribute("data-acc");
  var cat=btn.getAttribute("data-cat");
  var cur=S.catColors[acc+"_"+cat]||"";
  var h="<div style='display:flex;flex-direction:column;gap:14px;'>";
  h+="<div><label style='font-size:11px;color:var(--txs);display:block;margin-bottom:5px;font-weight:700;'>분류 이름</label>";
  h+="<input class='inp' id='ce-n' value='"+cat+"'/></div>";
  h+="<div><label style='font-size:11px;color:var(--txs);display:block;margin-bottom:5px;font-weight:700;'>배너 색상</label>";
  h+="<div style='display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:8px;'>";
  for(var i=0;i<COLORS.length;i++){
    var c=COLORS[i];
    var on=cur===c.v;
    var bd=on?"3px solid #fff":"2px solid transparent";
    var sh=on?"0 0 0 2px #FF6E41":"none";
    h+="<button type='button' data-cv='"+c.v+"' onclick='pickCC(this)'"
      +" style='background:"+c.v+";color:#fff;border:"+bd+";border-radius:10px;"
      +"padding:12px 8px;cursor:pointer;font-size:12px;font-weight:700;box-shadow:"+sh+";'>";
    h+=c.n+"</button>";
  }
  h+="</div>";
  h+="<button type='button' class='btn bg' style='width:100%;padding:8px;' onclick='pickCC(null)'>기본 색상 초기화</button></div>";
  h+="<div><label style='font-size:11px;color:var(--txs);display:block;margin-bottom:5px;font-weight:700;'>배너 이미지 (선택, 로고 등)</label>";
  h+="<div id='ce-img-box' style='display:flex;align-items:center;gap:10px;'></div>";
  h+="<input type='file' accept='image/*' id='ce-img-file' style='display:none;' onchange='onCatImgChange(this)'/>";
  h+="</div>";
  h+="<input type='hidden' id='ce-color' value='"+cur+"'/>";
  h+="<input type='hidden' id='ce-img' value='"+(S.catImages[acc+"_"+cat]||"")+"'/>";
  h+="<input type='hidden' id='ce-acc' value='"+acc+"'/>";
  h+="<input type='hidden' id='ce-cat' value='"+cat+"'/>";
  h+="<button type='button' class='btn bp' style='width:100%;padding:12px;font-size:14px;' onclick='submitCatEdit()'>수정 완료</button>";
  h+="</div>";
  showModal("분류 수정",h);
  renderCeImgBox();
}
function renderCeImgBox(){
  var box=document.getElementById("ce-img-box"); if(!box) return;
  var val=(document.getElementById("ce-img")||{}).value||"";
  var h="";
  if(val){
    h+="<img src='"+val+"' style='width:48px;height:48px;object-fit:contain;background:#fff;border:1.5px solid var(--bd);border-radius:8px;padding:4px;'/>";
    h+="<button type='button' class='btn bg' style='padding:6px 10px;font-size:11px;' onclick=\"document.getElementById('ce-img-file').click()\">변경</button>";
    h+="<button type='button' class='btn' style='padding:6px 10px;font-size:11px;background:var(--erb);color:var(--er);border:1.5px solid var(--erd);' onclick='removeCeImg()'>제거</button>";
  }else{
    h+="<button type='button' class='btn bg' style='padding:8px 14px;font-size:12px;' onclick=\"document.getElementById('ce-img-file').click()\">이미지 선택</button>";
  }
  box.innerHTML=h;
}
function onCatImgChange(input){
  var f=input.files&&input.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(e){ var el=document.getElementById("ce-img"); if(el) el.value=e.target.result; renderCeImgBox(); };
  r.readAsDataURL(f);
}
function removeCeImg(){
  var el=document.getElementById("ce-img"); if(el) el.value="";
  renderCeImgBox();
}
function pickCC(btn){
  var v=btn?btn.getAttribute("data-cv"):"";
  document.getElementById("ce-color").value=v;
  document.querySelectorAll("[data-cv]").forEach(function(b){
    var on=v!==""&&b.getAttribute("data-cv")===v;
    b.style.border=on?"3px solid #fff":"2px solid transparent";
    b.style.boxShadow=on?"0 0 0 2px #FF6E41":"none";
  });
}
function submitCatEdit(){
  var acc=document.getElementById("ce-acc").value;
  var oldCat=document.getElementById("ce-cat").value;
  var newName=document.getElementById("ce-n").value.trim();
  var newColor=document.getElementById("ce-color").value||"";
  var newImg=(document.getElementById("ce-img")||{}).value||"";
  if(!newName){alert("분류 이름을 입력하세요.");return;}
  if(newName!==oldCat){
    S.items[acc]=(S.items[acc]||[]).map(function(i){
      return i.category===oldCat?Object.assign({},i,{category:newName}):i;
    });
  }
  delete S.catColors[acc+"_"+oldCat];
  if(newColor) S.catColors[acc+"_"+newName]=newColor;
  delete S.catImages[acc+"_"+oldCat];
  if(newImg) S.catImages[acc+"_"+newName]=newImg;
  saveS();closeModal();renderInv();
}

// ── Category Sort ────────────────────────────────
var _sortAcc="";
var _sortCats=[];
var _dragIdx=-1;

function openSort(){
  _sortAcc=S.acc;
  var items=S.items[_sortAcc]||[];
  var rawCats=[];
  items.forEach(function(i){if(rawCats.indexOf(i.category)<0)rawCats.push(i.category);});
  var saved=S.catOrder[_sortAcc]||[];
  _sortCats=saved.filter(function(c){return rawCats.indexOf(c)>=0;});
  rawCats.forEach(function(c){if(_sortCats.indexOf(c)<0)_sortCats.push(c);});
  renderSortModal();
}
function renderSortModal(){
  var h="<div style='display:flex;flex-direction:column;gap:8px;'>";
  _sortCats.forEach(function(cat,i){
    var bg=S.catColors[_sortAcc+"_"+cat]||"linear-gradient(135deg,#FF6E41,#E85520)";
    var isFirst=i===0;
    var isLast=i===_sortCats.length-1;
    h+="<div style='display:flex;align-items:center;gap:8px;'>";
    h+="<div style='flex:1;display:flex;align-items:center;gap:10px;background:"+bg+";border-radius:10px;padding:11px 14px;color:#fff;'>";
    h+="<span style='font-weight:700;font-size:14px;'>"+cat+"</span>";
    h+="</div>";
    h+="<div style='display:flex;flex-direction:column;gap:4px;'>";
    h+="<button type='button' onclick='moveSort("+i+",-1)' "+(isFirst?"disabled":"")+
       " style='width:36px;height:36px;border-radius:10px;border:1.5px solid var(--bd);background:"+(isFirst?"#F7F3F1":"#fff")+";color:"+(isFirst?"#C4A090":"#FF6E41")+";cursor:"+(isFirst?"default":"pointer")+";font-size:16px;font-weight:700;'>▲</button>";
    h+="<button type='button' onclick='moveSort("+i+",1)' "+(isLast?"disabled":"")+
       " style='width:36px;height:36px;border-radius:10px;border:1.5px solid var(--bd);background:"+(isLast?"#F7F3F1":"#fff")+";color:"+(isLast?"#C4A090":"#FF6E41")+";cursor:"+(isLast?"default":"pointer")+";font-size:16px;font-weight:700;'>▼</button>";
    h+="</div></div>";
  });
  h+="</div>";
  h+="<button type='button' class='btn bp' style='width:100%;padding:12px;font-size:14px;margin-top:16px;' onclick='saveSort()'>순서 저장</button>";
  showModal("카테고리 순서 변경", h);
}
function moveSort(i, dir){
  var j=i+dir;
  if(j<0||j>=_sortCats.length) return;
  var tmp=_sortCats[i];
  _sortCats[i]=_sortCats[j];
  _sortCats[j]=tmp;
  renderSortModal();
}
function saveSort(){
  S.catOrder[_sortAcc]=_sortCats.slice();
  saveS();closeModal();renderInv();
}

// ── INVENTORY ─────────────────────────────────────
function renderInv(){
  var acc=S.acc;
  var items=S.items[acc]||[];
  // Build cats respecting saved order
  var rawCats=[];
  items.forEach(function(i){if(rawCats.indexOf(i.category)<0)rawCats.push(i.category);});
  var savedOrder=S.catOrder[acc]||[];
  var cats=savedOrder.filter(function(c){return rawCats.indexOf(c)>=0;});
  rawCats.forEach(function(c){if(cats.indexOf(c)<0)cats.push(c);});
  var tk=todayKey();
  var da=S.daily[acc]||{};
  var dc=da.date===tk?(da.count||0):0;
  var dm=da.date===tk?(da.amount||0):0;
  var ta=S.totals[acc]||{};
  var tc=ta.count||0,tm=ta.amount||0;
  var allStk=items.reduce(function(a,i){return a+i.stock;},0);
  var allAmt=items.reduce(function(a,i){return a+i.price*i.stock;},0);

  var h="<div class='atabs'>";
  ACCS.forEach(function(a){
    var cnt=(S.items[a]||[]).length;
    h+="<button class='atab"+(a===acc?" on":"")+"' onclick='setAcc(\""+a+"\")'>"+a;
    h+="<span style='display:block;font-size:10px;opacity:0.8;font-weight:500;'>"+cnt+"종</span></button>";
  });
  h+="</div>";

  h+="<div style='display:grid;grid-template-columns:1fr 1fr 1fr 1.4fr;gap:6px;margin-bottom:10px;'>";
  h+="<div class='sb sbn'><div class='sl'>금일/누적</div><div class='sv' style='font-size:11px;'>"+dc+" / "+tc+"건</div></div>";
  h+="<div class='sb sba'><div class='sl'>금일매출</div><div class='sv' style='font-size:11px;'>"+krw(dm)+"</div></div>";
  h+="<div class='sb sbn'><div class='sl'>총 재고</div><div class='sv' style='font-size:11px;'>"+allStk+"개</div></div>";
  h+="<div class='sb sbn'><div class='sl'>총 물품가</div><div class='sv' style='font-size:11px;'>"+krw(allAmt)+"</div></div>";
  h+="</div>";

  h+="<div style='text-align:center;margin-bottom:8px;'>";
  h+="<div style='font-size:15px;font-weight:900;'>"+acc+" <span style='color:var(--txl);font-weight:500;font-size:12px;'>("+items.length+"개 상품)</span></div>";
  h+="</div>";
  h+="<div style='display:flex;gap:6px;margin-bottom:12px;'>";
  h+="<button class='btn' style='flex:1;font-size:12px;padding:8px 0;background:#fff;color:var(--p);border:1.5px solid var(--pm);' onclick='openSort()'>순서 변경</button>";
  h+="<button class='btn' style='flex:1;font-size:12px;padding:8px 0;background:#fff;color:var(--p);border:1.5px solid var(--pm);' onclick='openBulk()'>일괄 추가</button>";
  h+="<button class='btn bp' style='flex:1;font-size:12px;padding:8px 0;display:flex;align-items:center;justify-content:center;gap:3px;' onclick='openAdd()'>"+ICO.plus+" 상품 추가</button>";
  h+="</div>";

  if(!items.length){
    h+="<div style='text-align:center;padding:50px 0;color:var(--txl);'><div style='font-size:42px;margin-bottom:10px;'>📦</div><div style='font-weight:700;color:var(--txs);'>등록된 상품 없음</div></div>";
  }

  cats.forEach(function(cat){
    var ci=items.filter(function(i){return i.category===cat;});
    var ck=acc+"_"+cat;
    var isOpen=!S.col[ck];
    var bg=catColor(acc,cat);
    var rad=isOpen?"12px 12px 0 0":"12px";
    var stk=ci.reduce(function(a,i){return a+i.stock;},0);
    var amt=ci.reduce(function(a,i){return a+i.price*i.stock;},0);
    var chev=isOpen?ICO.cu:ICO.cd;

    // Banner - using onclick on the div wrapper, stopPropagation on edit button
    h+="<div style='margin-bottom:10px;'>";
    h+="<div style='display:flex;align-items:center;justify-content:space-between;border:none;cursor:pointer;color:#fff;padding:10px 14px;border-radius:"+rad+";background:"+bg+";' onclick='togCat(\""+ck+"\")'>";
    h+="<div style='display:flex;flex-direction:column;align-items:flex-start;gap:3px;'>";
    var catImg=S.catImages[acc+"_"+cat]||"";
    h+="<div style='display:flex;align-items:center;gap:8px;'>";
    h+="<span style='font-size:15px;font-weight:900;'>"+cat+"</span>";
    h+="<span style='font-size:11px;background:rgba(255,255,255,0.22);padding:2px 8px;border-radius:20px;font-weight:700;'>"+ci.length+"종</span>";
    h+="</div>";
    h+="<span style='font-size:11px;opacity:0.85;'>재고 "+stk+"개 &middot; "+krw(amt)+"</span>";
    h+="</div>";
    h+="<div style='display:flex;align-items:center;gap:8px;'>";
    if(catImg) h+="<img src='"+catImg+"' style='width:42px;height:42px;object-fit:contain;background:#fff;border-radius:10px;padding:4px;flex-shrink:0;'/>";
    // Edit button — uses data attributes, onclick stops propagation
    h+="<button type='button' data-acc='"+acc+"' data-cat='"+cat+"' onclick='event.stopPropagation();editCat(this)' style='background:rgba(255,255,255,0.25);border:1px solid rgba(255,255,255,0.5);border-radius:8px;color:#fff;cursor:pointer;padding:3px 10px;font-size:11px;font-weight:700;'>수정</button>";
    h+=chev;
    h+="</div>";
    h+="</div>"; // end banner div

    if(isOpen){
      var borderCol=bg.indexOf("#")>=0?bg.split("#")[1].split(/[,)]/)[0]:"FF6E41";
    h+="<div style='background:var(--card);border:2px solid #"+borderCol+";border-top:none;border-radius:0 0 14px 14px;overflow:hidden;margin-bottom:12px;'>";
      ci.forEach(function(item,idx){
        var sold=item.stock===0;
        var ek=acc+"_exp_"+item.id;
        var isExp=!!S.exp[ek];
        var last=idx===ci.length-1;
        var rowBorder=last?"":"border-bottom:1.5px solid var(--bd);";
        var rowBg=sold?"background:var(--erb);":"";
        var nc=sold?"#D93025":"#1A0F0A";
        var nd=sold?"line-through":"none";
        var sc2=sold?"#D93025":"#1A0F0A";
        var expBg=isExp?"#FF6E41":"#FFF0EB";
        var expIco=isExp?ICO.eu:ICO.ed;
        var stClass=sold?"br":"bn";

        h+="<div class='ir' style='"+rowBorder+rowBg+"'>";
        // Name row
        var thumb=(item.images&&item.images[0])?item.images[0]:"";
        h+="<div style='display:flex;align-items:center;gap:10px;margin-bottom:7px;'>";
        h+="<div style='width:64px;height:64px;border-radius:10px;overflow:hidden;flex-shrink:0;background:var(--bg);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;cursor:pointer;' onclick='openEdit(\""+acc+"\","+item.id+")'>";
        h+= thumb ? "<img src='"+thumb+"' style='width:100%;height:100%;object-fit:cover;'/>" : "<span style='font-size:22px;color:var(--txl);'>🖼</span>";
        h+="</div>";
        h+="<div style='flex:1;min-width:0;cursor:pointer;' onclick='openEdit(\""+acc+"\","+item.id+")'>";

function setAcc(a){S.acc=a;renderInv();}
function togCat(k){S.col[k]=!S.col[k];renderInv();}
function togExp(acc,id){var k=acc+"_exp_"+id;S.exp[k]=!S.exp[k];renderInv();}
function delItem(acc,id){
  if(!confirm("삭제하시겠습니까?"))return;
  S.items[acc]=S.items[acc].filter(function(i){return i.id!==id;});
  saveS();renderInv();
}
function updStock(acc,id,d){
  S.items[acc]=S.items[acc].map(function(i){return i.id===id?Object.assign({},i,{stock:Math.max(0,i.stock+d)}):i;});
  saveS();renderInv();
}
function startSale(acc,id){
  S.items[acc]=S.items[acc].map(function(i){
    if(i.id!==id||i.stock<=0) return i;
    return Object.assign({},i,{stock:i.stock-1,reserving:(i.reserving||0)+1});
  });
  saveS();renderInv();
}
function cancelSale(acc,id){
  S.items[acc]=S.items[acc].map(function(i){
    if(i.id!==id||!(i.reserving>0)) return i;
    return Object.assign({},i,{stock:i.stock+1,reserving:i.reserving-1});
  });
  saveS();renderInv();
}
function copyDescFor(acc,id){
  var item=(S.items[acc]||[]).find(function(i){return i.id===id;});
  if(!item||!item.desc) return;
  navigator.clipboard.writeText(item.desc).then(function(){
    alert("설명을 복사했어요. 당근/번개 게시글에 붙여넣기 하세요.");
  }).catch(function(){
    alert("복사에 실패했어요. 직접 선택해서 복사해주세요.");
  });
}
var _bs={};
function togBunge(id){
  _bs[id]=!_bs[id];
  var pl=document.getElementById("pl"+id),pd=document.getElementById("pd"+id);
  var item=(S.items[S.acc]||[]).find(function(i){return i.id===id;});

}

function updDiscAmt(el){
  var origPrice=Number((document.getElementById("orig-price")||{}).value||0);
  var pctEl=document.getElementById("disc-pct");
  var priceEl=document.getElementById("ep");
  var preview=document.getElementById("disc-preview");
  if(pctEl) pctEl.value="";
  var amt=Number(el.value||0);
  var newPrice=Math.max(0,origPrice-amt);
  priceEl.value=newPrice;
  if(amt>0&&newPrice>0){
    var pctOff=Math.round(amt/origPrice*100);
    preview.style.display="block";
    preview.textContent=krw(origPrice)+" → "+krw(newPrice)+" ("+pctOff+"% 할인, −"+krw(amt)+")";
  } else { preview.style.display="none"; }
  updEditBunge();
}
function updDiscPct(el){
  var origPrice=Number((document.getElementById("orig-price")||{}).value||0);
  var amtEl=document.getElementById("disc-amt");
  var priceEl=document.getElementById("ep");
  var preview=document.getElementById("disc-preview");
  if(amtEl) amtEl.value="";
  var pct=Number(el.value||0);
  var newPrice=Math.round(origPrice*(1-pct/100));
  if(newPrice<0) newPrice=0;
  priceEl.value=newPrice;
  if(pct>0&&newPrice>=0){
    var diff=origPrice-newPrice;
    preview.style.display="block";
    preview.textContent=krw(origPrice)+" → "+krw(newPrice)+" ("+pct+"% 할인, −"+krw(diff)+")";
  } else { preview.style.display="none"; }
  updEditBunge();
}
function updDiscount(type, origPrice){
  var amtEl=document.getElementById("disc-amt");
  var pctEl=document.getElementById("disc-pct");
  var priceEl=document.getElementById("ep");
  var preview=document.getElementById("disc-preview");
  if(!amtEl||!pctEl||!priceEl||!preview) return;
  var newPrice=origPrice;
  if(type==="amt"){
    pctEl.value="";
    var amt=Number(amtEl.value||0);
    newPrice=Math.max(0,origPrice-amt);
  } else {
    amtEl.value="";
    var pct=Number(pctEl.value||0);
    newPrice=Math.round(origPrice*(1-pct/100));
  }
  priceEl.value=newPrice;
  if(newPrice!==origPrice&&newPrice>0){
    var diff=origPrice-newPrice;
    var pctOff=Math.round(diff/origPrice*100);
    preview.style.display="block";
    preview.textContent=krw(origPrice)+" → "+krw(newPrice)+" ("+pctOff+"% 할인, −"+krw(diff)+")";
    preview.style.color="#0F9E6E";
  } else {
    preview.style.display="none";
  }
  updEditBunge();
}
function updEditBunge(){
  var p=Number((document.getElementById("ep")||{}).value||0);
  var el=document.getElementById("eb");
  if(el&&p>0)el.textContent="번개장터 가이드가 → "+krw(bunge(p));
}
function submitEdit(){
  var acc=document.getElementById("ea").value;
  var id=Number(document.getElementById("ei").value);
  var name=((document.getElementById("en")||{}).value||"").trim();
  var price=Number((document.getElementById("ep")||{}).value||0);
  var origPrice=Number((document.getElementById("orig-price")||{}).value||0);
  var desc=((document.getElementById("e-desc")||{}).value||"").trim();
  if(!name||!price){alert("상품명과 판매가를 입력하세요.");return;}
  S.items[acc]=S.items[acc].map(function(i){
    if(i.id!==id) return i;
    var newItem=Object.assign({},i,{name:name,price:price,desc:desc,images:_editImages.slice(0,4)});
    // Save origPrice only if discount was applied
    if(origPrice>0&&price<origPrice) newItem.origPrice=origPrice;
    else if(price===origPrice||!origPrice) delete newItem.origPrice;
    return newItem;
  });
  saveS();closeModal();renderInv();
}

function fmtResv(el){
  var v=el.value.replace(/[^0-9]/g,"");
  var parts=[];
  for(var i=0;i<v.length;i+=4){ parts.push(v.slice(i,i+4)); }
  el.value=parts.join(" - ");
}

function switchDiscMode(m){
  document.getElementById("disc-mode-0").style.display=m===0?"block":"none";
  document.getElementById("disc-mode-1").style.display=m===1?"block":"none";
  document.getElementById("dm0").style.background=m===0?"var(--ps)":"#fff";
  document.getElementById("dm0").style.color=m===0?"var(--p)":"var(--txs)";
  document.getElementById("dm0").style.borderColor=m===0?"var(--p)":"var(--bd)";
  document.getElementById("dm1").style.background=m===1?"var(--ps)":"#fff";
  document.getElementById("dm1").style.color=m===1?"var(--p)":"var(--txs)";
  document.getElementById("dm1").style.borderColor=m===1?"var(--p)":"var(--bd)";

}
function updateSalePricePreview(base){
  var p=Number((document.getElementById("sp-price")||{}).value||0);
  var el=document.getElementById("sp-preview");
  if(!el)return;
  if(p>0&&p<base){
    var pct=Math.round((base-p)/base*100);
    el.style.display="block";
    el.innerHTML="<span style='color:var(--er);font-weight:700;'>-"+pct+"% 할인</span> &nbsp;"+krw(base)+" → <strong>"+krw(p)+"</strong>";
  } else el.style.display="none";
}
function updateSalePctPreview(base){
  var pct=Number((document.getElementById("sp-pct")||{}).value||0);
  var el=document.getElementById("sp-preview");
  if(!el)return;
  if(pct>0&&pct<100){
    var newP=Math.round(base*(1-pct/100));
    document.getElementById("sp-price").value=newP;
    el.style.display="block";
    el.innerHTML="<span style='color:var(--er);font-weight:700;'>-"+pct+"% 할인</span> &nbsp;"+krw(base)+" → <strong>"+krw(newP)+"</strong>";
  } else el.style.display="none";
}
function applySalePrice(){
  var idx=Number(document.getElementById("sp-lidx").value);
  var base=Number(document.getElementById("sp-base").value);
  var p=Number((document.getElementById("sp-price")||{}).value||0);

  S.sLines[idx].salePrice=p;

function clearSalePrice(i){

function setSaleAcc(a){S.sAcc=a;S.sLines=[{cat:"",iid:"",qty:1}];S.sShip=null;renderSale();}

function setSaleItem(i,v){S.sLines[i].iid=v;S.sLines[i].salePrice=0;renderSale();}
function setSaleQty(i,v){S.sLines[i].qty=v;renderSale();}
function setSaleShip(i){S.sShip=i;renderSale();}
function submitSale(){
  var acc=S.sAcc;
  var items=S.items[acc]||[];
  var res=S.sLines.map(function(l){var it=items.find(function(i){return i.id===Number(l.iid);});return{it:it,qty:l.qty,sub:(it&&!l.svc)?it.price*l.qty:0,svc:l.svc||false};});
  var sf=SHIPS[S.sShip].f;
  var tot=res.reduce(function(a,r){return a+r.sub;},0)+sf;
  var lines=res.map(function(r){return{itemId:r.it.id,itemName:r.it.name,category:r.it.category,qty:r.qty,unitPrice:r.svc?0:r.unitPrice,origUnitPrice:r.it?r.it.price:0,subtotal:r.sub,svc:r.svc,salePrice:r.salePrice};});
  // 재고만 차감 (누적판매/매출은 배송완료 시 반영)
  S.items[acc]=S.items[acc].map(function(item){
    var ln=lines.find(function(l){return l.itemId===item.id;});
    if(!ln)return item;
    return Object.assign({},item,{stock:Math.max(0,item.stock-ln.qty)});
  });
  var resv=((document.getElementById("s-resv")||{}).value||"").trim();
  S.orders.push({id:Date.now(),seq:S.orders.length+1,date:dateStr(),account:acc,lines:lines,shippingLabel:SHIPS[S.sShip].l,shippingFee:sf,totalPrice:tot,netAmount:tot,status:"배송전",resv:resv});
  S.sAcc="";S.sLines=[{cat:"",iid:"",qty:1}];S.sShip=null;
  saveS();go("ship");
}

function renderShip(){
  var pend=S.orders.filter(function(o){return o.status==="배송전";});
  var done=S.orders.filter(function(o){return o.status==="완료";});
  var ts=done.reduce(function(a,o){return a+o.totalPrice;},0);
  var tn=done.reduce(function(a,o){return a+o.netAmount;},0);
  var cur=S.shipTab||"pend";
  var list=cur==="pend"?pend:done;

  var h="<div class='sg'>";
  h+="<div class='sb sbn'><div class='sl'>총 판매금액</div><div class='sv'>"+krw(ts)+"</div></div>";
  h+="<div class='sb sba'><div class='sl'>총 실수령금액</div><div class='sv'>"+krw(tn)+"</div></div></div>";

  h+="<div class='atabs' style='margin-bottom:14px;'>";
  h+="<button class='atab"+(cur==="pend"?" on":"")+"' onclick='setShipTab(\"pend\")'>배송 대기&nbsp;"+pend.length+"건</button>";
  h+="<button class='atab"+(cur==="done"?" on":"")+"' onclick='setShipTab(\"done\")'>배송 완료&nbsp;"+done.length+"건</button>";
  h+="</div>";

  function mi(o){return o.lines.length>1?o.lines[0].itemName+" 외 "+(o.lines.length-1)+"건":o.lines[0].itemName;}

  function card(o,isDone){
    var c="<div class='card'>";
    // Top row: left info + right status badge
    c+="<div style='display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;'>";
    c+="<div style='flex:1;min-width:0;padding-right:8px;'>";
    c+="<div style='font-size:10px;color:var(--txl);'>"+o.date+"</div>";
    c+="<div style='font-weight:800;font-size:14px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'>"+o.seq+"번 · "+mi(o)+"</div>";
    c+="<div style='font-size:10px;color:var(--txs);margin-top:1px;'>"+o.account+" · "+o.shippingLabel+"</div>";
    if(!isDone&&o.resv){
      var dispResv=o.resv.replace(/[^0-9]/g,"");
      var rp=[];
      if(dispResv.length>0)rp.push(dispResv.slice(0,4));
      if(dispResv.length>4)rp.push(dispResv.slice(4,8));
      if(dispResv.length>8)rp.push(dispResv.slice(8,12));
      c+="<div style='font-size:10px;color:var(--p);font-weight:700;margin-top:2px;'>"+rp.join(" - ")+"</div>";
    }
    if(!isDone&&o.tracking) c+="<div style='font-size:10px;color:var(--ok);font-weight:700;margin-top:2px;'>운송장: "+o.tracking+"</div>";
    c+="</div>";
    c+="<span class='os "+(isDone?"od":"op")+"'>"+(isDone?"✓ 완료":"배송전")+"</span>";
    c+="</div>";
    // Sale amount row
    c+="<div style='display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-top:1px dashed var(--bd);margin-bottom:"+(isDone?"5px":"8px")+";'>";
    c+="<span style='color:var(--txs);'>판매금액</span><span style='font-weight:700;'>"+krw(o.totalPrice)+"</span></div>";
    if(isDone) c+="<div style='display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px;'><span style='color:var(--txs);'>실수령</span><span style='font-weight:700;color:var(--ok);'>"+krw(o.netAmount)+"</span></div>";
    // Buttons
    c+="<div style='display:flex;gap:7px;'>";
    c+="<button class='btn bg' style='flex:1;font-size:11px;padding:7px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:3px;' onclick='openDetail("+o.id+")'>"+ICO.info+" 상세</button>";
    if(!isDone) c+="<button class='btn bs' style='flex:1;font-size:11px;padding:7px;border-radius:10px;' onclick='openShip("+o.id+")'>배송 시작</button>";
    c+="<button style='background:var(--erb);border:1.5px solid var(--erd);color:var(--er);border-radius:10px;padding:7px 10px;cursor:pointer;font-size:13px;' onclick='delOrder("+o.id+")'>"+ICO.trash+"</button>";
    c+="</div></div>";
    return c;
  }

  if(!list.length){
    var emj=cur==="pend"?"🚚":"✅";
    var msg=cur==="pend"?"배송 대기 없음":"배송 완료 없음";
    h+="<div style='text-align:center;padding:50px 0;color:var(--txl);'><div style='font-size:42px;margin-bottom:10px;'>"+emj+"</div><div style='font-weight:700;color:var(--txs);'>"+msg+"</div></div>";
  } else {
    list.forEach(function(o){ h+=card(o,cur==="done"); });
  }

  document.getElementById("t-ship").innerHTML=h;
  updateBadge();
}

function setShipTab(t){ S.shipTab=t; renderShip(); }

function updateBadge(){
  var cnt=S.orders.filter(function(o){return o.status==="배송전";}).length;
  var old=document.getElementById("ship-badge");
  if(old) old.parentNode.removeChild(old);
  if(cnt>0){
    var nb=document.querySelectorAll(".nb")[2];
    if(!nb) return;
    nb.style.position="relative";
    var b=document.createElement("span");
    b.id="ship-badge";
    b.textContent=cnt>99?"99+":String(cnt);
    b.style.cssText="position:absolute;top:5px;right:18px;background:#D93025;color:#fff;border-radius:20px;font-size:9px;font-weight:900;padding:1px 5px;min-width:16px;text-align:center;line-height:16px;pointer-events:none;";
    nb.appendChild(b);
  }
}

function delOrder(id){
  if(!confirm("삭제하시겠습니까?")) return;
  var o=S.orders.find(function(o){return o.id===id;});
  if(!o){ S.orders=S.orders.filter(function(o){return o.id!==id;}); saveS(); renderShip(); return; }
  var acc=o.account;
  // 항상 재고 복구
  o.lines.forEach(function(l){
    S.items[acc]=(S.items[acc]||[]).map(function(item){
      if(item.id!==l.itemId) return item;
      var restoreVal=l.svc?0:l.qty*item.price;
      var newSoldCount=o.status==="완료"?Math.max(0,item.soldCount-l.qty):item.soldCount;
      var newSoldValue=o.status==="완료"?Math.max(0,item.soldValue-restoreVal):item.soldValue;
      return Object.assign({},item,{stock:item.stock+l.qty,soldCount:newSoldCount,soldValue:newSoldValue});
    });
  });
  // 배송완료 삭제 시 통계도 복구
  if(o.status==="완료"){
    var saleAmt=o.lines.reduce(function(a,l){return a+(l.svc?0:l.subtotal);},0);
    var saleCnt=o.lines.reduce(function(a,l){return a+l.qty;},0);
    // totals 복구
    var pt=S.totals[acc]||{};
    S.totals[acc]={count:Math.max(0,(pt.count||0)-saleCnt),amount:Math.max(0,(pt.amount||0)-saleAmt)};
    // daily 복구 (같은 날짜면)
    var da=S.daily[acc]||{};
    if(da.date===o.date||true){ // 날짜 무관하게 복구
      S.daily[acc]={date:da.date||"",count:Math.max(0,(da.count||0)-saleCnt),amount:Math.max(0,(da.amount||0)-saleAmt)};
    }
  }
  S.orders=S.orders.filter(function(o){return o.id!==id;});
  saveS();renderShip();renderInv();
}

    h+="<div style='display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--bd);'><span style='color:var(--txs);'>"+r[0]+"</span><span style='font-weight:600;'>"+r[1]+"</span></div>";
  });

  h+="<div style='display:flex;justify-content:space-between;padding:10px 0 4px;font-weight:900;font-size:15px;'><span>총 판매금액</span><span style='color:var(--p);'>"+krw(o.totalPrice)+"</span></div>";

  h+="</div></div>";
  showModal(o.seq+"번 상세",h);
}

  h+="<div style='background:var(--ps);border:1px solid var(--pm);border-radius:9px;padding:11px;font-size:13px;'>";
  h+="<div style='color:var(--txs);font-size:11px;margin-bottom:3px;'>주문</div>";

  h+="<div style='color:var(--txs);font-size:12px;margin-top:3px;'>판매금액: <strong style='color:var(--p);'>"+krw(o.totalPrice)+"</strong></div></div>";
  h+="<div style='margin-bottom:12px;'><label style='font-size:11px;color:var(--txs);display:block;margin-bottom:5px;font-weight:700;'>운송장 번호 (선택)</label>";
  h+="<input class='inp' id='track' value='"+(o.tracking||"")+"' placeholder='운송장 번호 입력'/></div>";
  h+="<div><label style='font-size:11px;color:var(--txs);display:block;margin-bottom:5px;font-weight:700;'>실제 택배비 (원)</label>";
  h+="<input class='inp' type='number' id='sf' value='"+o.shippingFee+"' oninput='updShipNet("+o.totalPrice+")'/></div>";
  h+="<div style='background:var(--okb);border:1px solid #8EDCBA;border-radius:9px;padding:12px;font-size:13px;'>";
  h+="<div style='display:flex;justify-content:space-between;margin-bottom:5px;'><span style='color:var(--txs);'>판매금액</span><span style='font-weight:600;'>"+krw(o.totalPrice)+"</span></div>";
  h+="<div style='display:flex;justify-content:space-between;margin-bottom:10px;'><span style='color:var(--txs);'>택배비</span><span style='font-weight:600;color:var(--er);' id='sfd'>− "+krw(o.shippingFee)+"</span></div>";
  h+="<div style='display:flex;justify-content:space-between;font-weight:900;font-size:15px;border-top:1.5px dashed #9EE5CC;padding-top:10px;'><span>실수령금액</span><span style='color:var(--ok);' id='snd'>"+krw(o.totalPrice-o.shippingFee)+"</span></div></div>";
  h+="<input type='hidden' id='s-oid' value='"+id+"'/><input type='hidden' id='s-tot' value='"+o.totalPrice+"'/>";
  h+="<button type='button' class='btn bs' style='width:100%;padding:12px;font-size:14px;' onclick='confirmShip()'>배송 완료 처리</button></div>";
  showModal("배송 시작",h);
}
function updShipNet(tot){
  var fee=Number((document.getElementById("sf")||{}).value||0);
  var fd=document.getElementById("sfd"),nd=document.getElementById("snd");
  if(fd)fd.textContent="− "+krw(fee);
  if(nd)nd.textContent=krw(tot-fee);
}
function confirmShip(){
  var id=Number(document.getElementById("s-oid").value);
  var tot=Number(document.getElementById("s-tot").value);
  var fee=Number((document.getElementById("sf")||{}).value||0);
  var track=((document.getElementById("track")||{}).value||"").trim();
  var o2=S.orders.find(function(o){return o.id===id;});
  if(o2){
    var acc2=o2.account;
    o2.lines.forEach(function(l){
      S.items[acc2]=(S.items[acc2]||[]).map(function(item){
        if(item.id!==l.itemId) return item;
        var addVal=l.svc?0:l.qty*item.price;
        return Object.assign({},item,{soldCount:item.soldCount+l.qty,soldValue:item.soldValue+addVal});
      });
    });
    var saleAmt=o2.lines.reduce(function(a,l){return a+(l.svc?0:l.subtotal);},0);
    var saleCnt=o2.lines.reduce(function(a,l){return a+l.qty;},0);
    var tk2=todayKey();
    var prev2=S.daily[acc2]||{};
    S.daily[acc2]=prev2.date===tk2?{date:tk2,count:(prev2.count||0)+saleCnt,amount:(prev2.amount||0)+saleAmt}:{date:tk2,count:saleCnt,amount:saleAmt};
    var pt2=S.totals[acc2]||{};
    S.totals[acc2]={count:(pt2.count||0)+saleCnt,amount:(pt2.amount||0)+saleAmt};
  }
  S.orders=S.orders.map(function(o){return o.id===id?Object.assign({},o,{status:"완료",actualFee:fee,netAmount:tot-fee,tracking:track}):o;});
  saveS();closeModal();renderShip();renderInv();
}

function openEditSold(acc, id){
  var item=(S.items[acc]||[]).find(function(i){return i.id===id;});
  if(!item) return;
  var h="<div style='display:flex;flex-direction:column;gap:14px;'>";
  h+="<div style='background:var(--ps);border-radius:10px;padding:12px;font-size:13px;'>";
  h+="<div style='font-weight:700;'>"+item.name+"</div>";
  h+="<div style='color:var(--txs);font-size:12px;margin-top:2px;'>"+item.category+" · "+acc+"</div>";
  h+="</div>";
  h+="<div><label style='font-size:11px;color:var(--txs);display:block;margin-bottom:5px;font-weight:700;'>누적 판매 개수</label>";
  h+="<input class='inp' type='number' id='es-cnt' min='0' value='"+item.soldCount+"'/>";
  h+="<div style='font-size:11px;color:var(--txl);margin-top:4px;'>현재: "+item.soldCount+"개 (판매단가: "+krw(item.price)+")</div></div>";
  h+="<input type='hidden' id='es-acc' value='"+acc+"'/>";
  h+="<input type='hidden' id='es-id' value='"+id+"'/>";
  h+="<input type='hidden' id='es-price' value='"+item.price+"'/>";
  h+="<button type='button' class='btn bp' style='width:100%;padding:12px;font-size:14px;' onclick='submitEditSold()'>수정 완료</button>";
  h+="</div>";
  showModal("누적 판매 수정", h);
}
function submitEditSold(){
  var acc=document.getElementById("es-acc").value;
  var id=Number(document.getElementById("es-id").value);
  var newCnt=Math.max(0,Number(document.getElementById("es-cnt").value)||0);
  var price=Number(document.getElementById("es-price").value||0);
  S.items[acc]=(S.items[acc]||[]).map(function(item){
    if(item.id!==id) return item;
    var diff=newCnt-item.soldCount; // positive = added, negative = reduced
    var newVal=Math.max(0,item.soldValue+diff*price);
    // also fix totals
    var pt=S.totals[acc]||{};
    S.totals[acc]={count:Math.max(0,(pt.count||0)+diff),amount:Math.max(0,(pt.amount||0)+diff*price)};
    return Object.assign({},item,{soldCount:newCnt,soldValue:newVal});
  });
  saveS();closeModal();renderStat();
}
function renderStat(){
  var all=ACCS.reduce(function(a,ac){return a.concat((S.items[ac]||[]).map(function(i){return Object.assign({},i,{account:ac});}));},[]);
  var done=S.orders.filter(function(o){return o.status==="완료";});
  var ts=done.reduce(function(a,o){return a+o.totalPrice;},0);
  var tn=done.reduce(function(a,o){return a+o.netAmount;},0);
  var tv=all.reduce(function(a,i){return a+i.price*i.stock;},0);
  var h="<div style='font-size:16px;font-weight:900;margin-bottom:14px;'>통계</div>";
  h+="<div class='gc'><div style='font-size:11px;color:rgba(255,255,255,0.75);font-weight:700;margin-bottom:10px;'>전체 통합</div>";
  h+="<div class='gg'>";
  h+="<div class='gbx'><div class='gl'>총 재고가치</div><div class='gv'>"+krw(tv)+"</div></div>";
  h+="<div class='gbx'><div class='gl'>총 판매금액</div><div class='gv'>"+krw(ts)+"</div></div>";
  h+="<div class='gbx'><div class='gl'>총 실수령</div><div class='gv'>"+krw(tn)+"</div></div>";
  h+="</div></div>";

  ACCS.forEach(function(ac){
    var ao=done.filter(function(o){return o.account===ac;});
    var sales=ao.reduce(function(a,o){return a+o.totalPrice;},0);
    var net=ao.reduce(function(a,o){return a+o.netAmount;},0);
    var cnt=ao.reduce(function(a,o){return a+o.lines.reduce(function(b,l){return b+l.qty;},0);},0);
    var ai=all.filter(function(i){return i.account===ac;});

    h+="<div style='background:#fff;border:1.5px solid var(--bd);border-radius:14px;padding:13px;margin-bottom:9px;'>";
    h+="<div style='font-size:13px;font-weight:900;color:var(--p);margin-bottom:10px;'>"+ac+"</div>";
    h+="<div class='pc'>";
    h+="<div class='sb sbn'><div class='sl'>판매수량</div><div class='sv'>"+cnt+"개</div></div>";
    h+="<div class='sb sbn'><div class='sl'>판매금액</div><div class='sv'>"+krw(sales)+"</div></div>";
    h+="<div class='sb sba'><div class='sl'>실수령</div><div class='sv'>"+krw(net)+"</div></div>";
    h+="</div>";

    if(ai.length){
      // IP(카테고리)별로 그룹핑
      var cats=[];
      ai.forEach(function(it){if(cats.indexOf(it.category)<0)cats.push(it.category);});
      // catOrder 적용
      var savedOrder=S.catOrder[ac]||[];
      var orderedCats=savedOrder.filter(function(c){return cats.indexOf(c)>=0;});
      cats.forEach(function(c){if(orderedCats.indexOf(c)<0)orderedCats.push(c);});

      h+="<div style='margin-top:10px;border-top:1px dashed var(--bd);padding-top:10px;'>";
      orderedCats.forEach(function(cat){
        var catItems=ai.filter(function(it){return it.category===cat;});
        var bg=catColor(ac,cat);
        // 카테고리 배너
        h+="<div style='background:"+bg+";border-radius:10px;padding:7px 12px;margin-bottom:6px;display:flex;align-items:center;gap:8px;'>";
        h+="<span style='font-size:12px;font-weight:900;color:#fff;'>"+cat+"</span>";
        h+="<span style='font-size:10px;background:rgba(255,255,255,0.25);color:#fff;border-radius:10px;padding:1px 7px;font-weight:700;'>"+catItems.length+"종</span>";
        h+="</div>";
        // 상품 목록
        catItems.forEach(function(it){
          var nc=it.stock===0?"#D93025":"#1A0F0A";
          var nd=it.stock===0?"line-through":"none";
          h+="<div style='display:flex;align-items:center;justify-content:space-between;font-size:12px;padding:5px 8px;border-bottom:1px dashed var(--bd);gap:8px;'>";
          h+="<div style='flex:1;min-width:0;'>";
          h+="<div style='font-weight:600;color:"+nc+";text-decoration:"+nd+";white-space:nowrap;overflow:hidden;text-overflow:ellipsis;'>"+it.name+"</div>";
          h+="</div>";
          h+="<div style='display:flex;align-items:center;gap:8px;flex-shrink:0;'>";
          h+="<div style='text-align:right;'>";
          h+="<div style='color:var(--txs);font-size:10px;white-space:nowrap;'>"+it.soldCount+"개 판매</div>";
          h+="<div style='font-weight:700;color:var(--p);font-size:11px;'>"+krw(it.soldValue)+"</div>";
          h+="</div>";
          h+="<button type='button' onclick='openEditSold(\""+ac+"\","+it.id+")' style='background:var(--ps);border:1.5px solid var(--pm);border-radius:8px;color:var(--p);cursor:pointer;padding:3px 8px;font-size:11px;font-weight:700;white-space:nowrap;'>수정</button>";
          h+="</div></div>";
        });
        h+="<div style='margin-bottom:8px;'></div>";
      });
      h+="</div>";
    }
    h+="</div>";
  });
  document.getElementById("t-stat").innerHTML=h;
}

function exportData(){
  var data = {
    items: S.items,
    orders: S.orders,
    catColors: S.catColors,
    catImages: S.catImages,
    daily: S.daily,
    totals: S.totals,
    catOrder: S.catOrder,
    exportedAt: new Date().toISOString()
  };
  var json = JSON.stringify(data, null, 2);
  var blob = new Blob([json], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "재고관리_백업_" + new Date().toLocaleDateString("ko-KR").replace(/\. /g,"-").replace(".","") + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importData(){
  var el = document.getElementById("import-file");
  if(el){ el.value=""; el.click(); }
}
function onImportFile(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    try{
      var d = JSON.parse(ev.target.result);
      if(!d || typeof d !== "object"){ alert("올바른 백업 파일이 아닙니다."); return; }
      if(confirm("현재 데이터를 백업 파일로 덮어씁니다. 계속하시겠습니까?")){
        ACCS.forEach(function(a){ S.items[a] = Array.isArray(d.items&&d.items[a]) ? d.items[a] : []; });
        S.orders = Array.isArray(d.orders) ? d.orders : [];
        if(d.catColors && typeof d.catColors==="object") S.catColors = d.catColors;
        if(d.catImages && typeof d.catImages==="object") S.catImages = d.catImages;
        if(d.daily && typeof d.daily==="object") S.daily = d.daily;
        if(d.totals && typeof d.totals==="object") S.totals = d.totals;
        if(d.catOrder && typeof d.catOrder==="object") S.catOrder = d.catOrder;
        saveS();
        alert("✅ 가져오기 완료!");
        renderInv(); updateBadge();
      }
    }catch(err){ alert("파일을 읽을 수 없습니다."); }
  };
  reader.readAsText(file);
}

// Collapse all categories by default on first load
(function(){
  ACCS.forEach(function(acc){
    var items=S.items[acc]||[];
    var cats=[];
    items.forEach(function(i){if(cats.indexOf(i.category)<0)cats.push(i.category);});
    cats.forEach(function(cat){
      var ck=acc+"_"+cat;
      if(S.col[ck]===undefined) S.col[ck]=true; // collapsed by default
    });
  });
})();
renderInv();
updateBadge();
</script>
